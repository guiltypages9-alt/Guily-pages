<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guilty Pages</title>
<style>
:root{
  --ink:#302438;
  --muted:#76677d;
  --paper:#fff7fc;
  --pink:#f3d9e8;
  --pink2:#f9eaf3;
  --lilac:#e6dcf5;
  --lilac2:#f1ebfa;
  --line:#e8d8e7;
  --card:#fff;
  --accent:#8b628e;
  --accent-dark:#604466;
}
*{
  box-sizing:border-box
}
body{
  margin:0;
  color:var(--ink);
  font-family:Georgia,serif;
  background:
    radial-gradient(circle at 10% 10%,#f5d9e8 0,transparent 28%),
    radial-gradient(circle at 90% 15%,#e5dcf5 0,transparent 30%),
    radial-gradient(circle at 50% 100%,#f2dfef 0,transparent 35%),
    var(--paper);
  min-height:100vh;
}
header{
  padding:28px 20px 14px;
  text-align:center;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(10px);
}
.logo{
  font-size:32px;
  font-weight:700;
  letter-spacing:.5px;
}
.tag{
  font:13px Arial,sans-serif;
  color:var(--muted);
  margin-top:6px;
}
nav{
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
  padding:12px;
}
nav button,
.action{
  border:1px solid #d8c5d6;
  background:rgba(255,255,255,.88);
  border-radius:999px;
  padding:9px 14px;
  color:var(--ink);
  cursor:pointer;
  transition:.2s;
}
nav button:hover,
.action:hover{
  transform:translateY(-1px);
  background:var(--pink2);
}
nav button.active,
.action.primary{
  background:var(--accent-dark);
  color:#fff;
  border-color:var(--accent-dark);
}
main{
  max-width:1000px;
  margin:auto;
  padding:22px 16px 50px;
}
.hero{
  text-align:center;
  padding:30px 10px 18px;
}
.hero h1{
  font-size:42px;
  margin:8px 0;
}
.hero p{
  font:15px Arial,sans-serif;
  color:var(--muted);
}
.search{
  display:flex;
  gap:8px;
  max-width:720px;
  margin:20px auto;
}
.search input{
  flex:1;
  padding:14px;
  border:1px solid #d9cbd3;
  border-radius:12px;
  font-size:16px;
  background:#fff;
}
button{
  font:14px Arial,sans-serif;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:16px;
}
.card{
  background:rgba(255,255,255,.92);
  border:1px solid var(--line);
  border-radius:18px;
  padding:15px;
  box-shadow:0 8px 25px rgba(80,50,80,.08);
}
.cover{
  width:100%;
  height:240px;
  object-fit:cover;
  border-radius:12px;
  background:
    linear-gradient(135deg,var(--pink),var(--lilac));
}
.title{
  font-size:19px;
  font-weight:700;
  margin:11px 0 5px;
}
.author{
  font:13px Arial,sans-serif;
  color:var(--muted);
  min-height:34px;
}
.empty{
  text-align:center;
  color:var(--muted);
  padding:45px 15px;
  font:14px Arial,sans-serif;
}
.panel{
  background:rgba(255,255,255,.88);
  border:1px solid var(--line);
  border-radius:20px;
  padding:20px;
  margin-top:20px;
  box-shadow:0 8px 30px rgba(80,50,80,.07);
}
.panel h2{
  margin-top:0;
}
input.profile{
  width:100%;
  padding:12px;
  border:1px solid #d9cbd3;
  border-radius:10px;
  margin:8px 0 12px;
  background:#fff;
}
.small{
  font:12px Arial,sans-serif;
  color:var(--muted);
}
.status{
  margin:10px 0;
  padding:12px;
  border-radius:12px;
  background:linear-gradient(135deg,var(--pink2),var(--lilac2));
  font:13px Arial,sans-serif;
}
.account-box{
  background:linear-gradient(135deg,#f8e4ef,#eee5f8);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  margin-bottom:18px;
}
.account-name{
  font-size:25px;
  font-weight:700;
  margin-bottom:5px;
}
.account-email{
  font:13px Arial,sans-serif;
  color:var(--muted);
}
hr{
  border:0;
  border-top:1px solid var(--line);
  margin:20px 0;
}
@media(max-width:600px){
  .hero h1{
    font-size:34px;
  }
  .search{
    flex-direction:column;
  }
  .search button{
    width:100%;
  }
  .cover{
    height:230px;
  }
}
</style>
</head>
<body>
<header>
  <div class="logo">Guilty Pages</div>
  <div class="tag">Your books. Your shelves. Your guilty pleasures.</div>
  <nav>
    <button class="active" data-tab="discover">
      Discover
    </button>
    <button data-tab="tbr">
      TBR <span id="tbrCount"></span>
    </button>
    <button data-tab="dnf">
      DNF <span id="dnfCount"></span>
    </button>
    <button data-tab="reread">
      Reread <span id="rereadCount"></span>
    </button>
    <button data-tab="profile">
      Profile
    </button>
  </nav>
</header>
<main>
<section id="discover" class="tab">
  <div class="hero">
    <h1>Read something you shouldn't?</h1>
    <p>Find it. Save it. Confess it.</p>
  </div>
  <div class="search">
    <input
      id="searchInput"
      placeholder="Search books, authors, guilty pleasures..."
    >
    <button class="action primary" id="searchBtn">
      Search
    </button>
  </div>
  <div id="results" class="grid"></div>
</section>
<section id="tbr" class="tab" hidden>
  <div class="panel">
    <h2>My TBR</h2>
    <div id="tbrList" class="grid"></div>
  </div>
</section>
<section id="dnf" class="tab" hidden>
  <div class="panel">
    <h2>DNF</h2>
    <div id="dnfList" class="grid"></div>
  </div>
</section>
<section id="reread" class="tab" hidden>
  <div class="panel">
    <h2>Reread</h2>
    <div id="rereadList" class="grid"></div>
  </div>
</section>
<section id="profile" class="tab" hidden>
  <div class="panel">
    <h2>Your Profile</h2>
    <div id="authStatus" class="status">
      Checking account…
    </div>
    <!-- LOGIN AREA -->
    <div id="loginArea">
      <label>Email</label>
      <input
        class="profile"
        id="email"
        type="email"
        placeholder="Your email"
      >
      <label>Password</label>
      <input
        class="profile"
        id="password"
        type="password"
        placeholder="Your password"
      >
      <button class="action primary" id="signUp">
        Create account
      </button>
      <button class="action" id="signIn">
        Sign in
      </button>
    </div>
    <!-- AUTHENTICATED PROFILE -->
    <div id="accountArea" hidden>
      <div class="account-box">
        <div class="account-name" id="accountName">
          Reader
        </div>
        <div class="account-email" id="accountEmail">
        </div>
      </div>
    </div>
    <hr>
    <label>Display name</label>
    <input
      class="profile"
      id="displayName"
      placeholder="Your reader name"
    >
    <button class="action primary" id="saveProfile">
      Save profile
    </button>
    <button class="action" id="signOut">
      Sign out
    </button>
    <p id="saved" class="small"></p>
  </div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL=
  "https://wmpovzrwdvvmabxrcwtp.supabase.co";
const SUPABASE_PUBLISHABLE_KEY=
  "sb_publishable_m-YSGRdUnH0eXTBVC5r3sw_l6oLwWSz";
const supabaseClient=
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );
const KEY="guiltyPages";
let state=JSON.parse(
  localStorage.getItem(KEY) ||
  '{"tbr":[],"dnf":[],"reread":[],"name":""}'
);
const save=()=>{
  localStorage.setItem(
    KEY,
    JSON.stringify(state)
  );
  renderCounts();
};
const tabs=[
  ...document.querySelectorAll(".tab")
];
document.querySelectorAll("nav button").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll("nav button")
      .forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    tabs.forEach(s=>{
      s.hidden=s.id!==b.dataset.tab;
    });
    if(b.dataset.tab!=="discover"){
      renderShelf(b.dataset.tab);
    }
    if(b.dataset.tab==="profile"){
      loadProfile();
    }
  };
});
function renderCounts(){
  tbrCount.textContent=
    state.tbr.length
      ?`(${state.tbr.length})`
      :"";
  dnfCount.textContent=
    state.dnf.length
      ?`(${state.dnf.length})`
      :"";
  rereadCount.textContent=
    state.reread.length
      ?`(${state.reread.length})`
      :"";
}
function esc(s){
  return String(s||"").replace(
    /[&<>"']/g,
    c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );
}
function card(book,shelf){
  const cover=
    book.cover_i
      ?`https://covers.openlibrary.org/b/id/${book.cover_i}-M.jpg`
      :"";
  return `<article class="card">
    ${
      cover
        ?`<img class="cover" src="${cover}" alt="">`
        :`<div class="cover"></div>`
    }
    <div class="title">
      ${esc(book.title)}
    </div>
    <div class="author">
      ${esc(
        (book.author_name||[]).join(", ")
      )}
    </div>
    ${
      shelf
      ?`<button
          class="action"
          onclick="removeBook(
            '${esc(shelf)}',
            '${esc(book.key)}'
          )">
          Remove
        </button>`
      :`
        <button
          class="action primary"
          onclick="addBook(
            'tbr',
            ${JSON.stringify(book).replace(/</g,"\\u003c")}
          )">
          Add to TBR
        </button>
        <button
          class="action"
          onclick="addBook(
            'dnf',
            ${JSON.stringify(book).replace(/</g,"\\u003c")}
          )">
          DNF
        </button>
        <button
          class="action"
          onclick="addBook(
            'reread',
            ${JSON.stringify(book).replace(/</g,"\\u003c")}
          )">
          Reread
        </button>
      `
    }
  </article>`;
}
async function search(){
  const q=
    searchInput.value.trim();
  if(!q)return;
  results.innerHTML=
    '<div class="empty">Searching the library…</div>';
  try{
    const r=await fetch(
      "https://openlibrary.org/search.json?q="+
      encodeURIComponent(q)+
      "&limit=12"
    );
    const d=await r.json();
    results.innerHTML=
      d.docs?.length
        ?d.docs.map(x=>card(x)).join("")
        :'<div class="empty">No books found.</div>';
  }catch(e){
    results.innerHTML=
      '<div class="empty">Could not reach Open Library. Please try again.</div>';
  }
}
searchBtn.onclick=search;
searchInput.addEventListener(
  "keydown",
  e=>{
    if(e.key==="Enter")search();
  }
);
async function addBook(shelf,b){
  if(
    state[shelf].some(
      x=>x.key===b.key
    )
  )return;
  const {
    data:{user}
  }=await supabaseClient.auth.getUser();
  if(user){
    const {error}=
      await supabaseClient
        .from("shelf_books")
        .insert({
          user_id:user.id,
          shelf:shelf,
          book_key:b.key,
          book_data:b
        });
    if(error){
      alert("Could not save this book.");
      console.error(error);
      return;
    }
  }
  state[shelf].push(b);
  save();
  alert(
    `Added to ${shelf.toUpperCase()}.`
  );
}
async function removeBook(shelf,key){
  const {
    data:{user}
  }=await supabaseClient.auth.getUser();
  if(user){
    const {error}=
      await supabaseClient
        .from("shelf_books")
        .delete()
        .eq("user_id",user.id)
        .eq("shelf",shelf)
        .eq("book_key",key);
    if(error){
      alert("Could not remove this book.");
      console.error(error);
      return;
    }
  }
  state[shelf]=state[shelf].filter(
    x=>x.key!==key
  );
  save();
  renderShelf(shelf);
}
function renderShelf(shelf){
  const el=
    document.getElementById(
      shelf+"List"
    );
  const arr=
    state[shelf]||[];
  el.innerHTML=
    arr.length
      ?arr.map(x=>card(x,shelf)).join("")
      :'<div class="empty">Nothing here yet.</div>';
}
async function loadShelves(){
  const {
    data:{user}
  }=await supabaseClient.auth.getUser();
  if(!user)return;
  const {data,error}=
    await supabaseClient
      .from("shelf_books")
      .select("shelf,book_data")
      .eq("user_id",user.id)
      .order("created_at",{ascending:true});
  if(error){
    console.error(error);
    return;
  }
  state.tbr=[];
  state.dnf=[];
  state.reread=[];
  (data||[]).forEach(row=>{
    if(state[row.shelf]){
      state[row.shelf].push(
        row.book_data
      );
    }
  });
  save();
  renderShelf("tbr");
  renderShelf("dnf");
  renderShelf("reread");
}
function showAuthenticated(user){
  loginArea.hidden=true;
  accountArea.hidden=false;
  authStatus.textContent=
    `Signed in as ${user.email||"your account"}.`;
  email.value=
    user.email||"";
  accountEmail.textContent=
    user.email||"";
  signUp.hidden=true;
  signIn.hidden=true;
}
function showSignedOut(){
  loginArea.hidden=false;
  accountArea.hidden=true;
  authStatus.textContent=
    "Not signed in. Create an account or sign in.";
  signUp.hidden=false;
  signIn.hidden=false;
}
async function loadProfile(){
  const {
    data:{user}
  }=await supabaseClient.auth.getUser();
  if(!user){
    showSignedOut();
    displayName.value=
      state.name||"";
    return;
  }
  showAuthenticated(user);
  const {data,error}=
    await supabaseClient
      .from("profiles")
      .select("display_name,username")
      .eq("id",user.id)
      .maybeSingle();
  if(error){
    saved.textContent=
      "Connected, but the profile could not be loaded.";
    return;
  }
  if(data){
    displayName.value=
      data.display_name||
      data.username||
      "";
    state.name=
      displayName.value;
    accountName.textContent=
      displayName.value||"Reader";
    save();
  }else{
    accountName.textContent=
      "Reader";
  }
}
signUp.onclick=async()=>{
  const e=
    email.value.trim();
  const p=
    password.value;
  if(!e||!p){
    saved.textContent=
      "Enter your email and password first.";
    return;
  }
  const {data,error}=
    await supabaseClient.auth.signUp({
      email:e,
      password:p
    });
  if(error){
    saved.textContent=
      error.message;
    return;
  }
  if(data.user){
    saved.textContent=
      "Account created. You can now sign in.";
    authStatus.textContent=
      "Account created.";
  }
};
signIn.onclick=async()=>{
  const e=
    email.value.trim();
  const p=
    password.value;
  if(!e||!p){
    saved.textContent=
      "Enter your email and password first.";
    return;
  }
  const {data,error}=
    await supabaseClient.auth.signInWithPassword({
      email:e,
      password:p
    });
  if(error){
    saved.textContent=
      error.message;
    return;
  }
  if(data.user){
    showAuthenticated(data.user);
    saved.textContent=
      "Signed in successfully.";
    await loadProfile();
    await loadShelves();
  }
};
saveProfile.onclick=async()=>{
  const name=
    displayName.value.trim();
  if(!name){
    saved.textContent=
      "Please enter a display name.";
    return;
  }
  const {
    data:{user}
  }=await supabaseClient.auth.getUser();
  if(!user){
    state.name=name;
    save();
    saved.textContent=
      "Saved on this device. Sign in to save it to your account.";
    return;
  }
  const {error}=
    await supabaseClient
      .from("profiles")
      .upsert(
        {
          id:user.id,
          username:name,
          display_name:name
        },
        {
          onConflict:"id"
        }
      );
  if(error){
    saved.textContent=
      "Could not save profile: "+
      error.message;
    return;
  }
  state.name=name;
  accountName.textContent=name;
  save();
  saved.textContent=
    "Profile saved to your account.";
};
signOut.onclick=async()=>{
  await supabaseClient.auth.signOut();
  showSignedOut();
  saved.textContent=
    "You have been signed out.";
  email.value="";
  password.value="";
  displayName.value="";
};
supabaseClient.auth.onAuthStateChange(
  async(event,session)=>{
    if(session?.user){
      showAuthenticated(session.user);
      await loadProfile();
      await loadShelves();
    }else{
      showSignedOut();
    }
  }
);
displayName.value=
  state.name||"";
renderCounts();
loadProfile().then(()=>{
  loadShelves();
});
</script>
</body>
</html>
